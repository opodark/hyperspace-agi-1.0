# HyperSpace-AGI v1.0 - Nodo Esterno
# Ogni nodo ha: Ollama locale + Node Agent + WebUI + Dashboard
#
# Setup:
#   ./setup.sh  (genera .env automaticamente)
#
# Avvio:
#   docker compose -f docker-compose.external-node.yml up -d --build

services:
  ollama:
    image: ollama/ollama:latest
    container_name: hyperspace-ollama-ext
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=5m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 30s
    networks:
      - hyperspace-ext

  webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: hyperspace-webui-ext
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=hyperspace-agi-ext-secret
      - ENABLE_SIGNUP=true
    volumes:
      - webui_data:/app/backend/data
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - hyperspace-ext

  node:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    container_name: hyperspace-node-ext
    ports:
      - "8765:8765"
    environment:
      - NODE_API_PORT=8765
      # --- identita' --- lette da .env ---
      - NODE_ID=${NODE_ID:-node-ext}
      - NODE_HOST=${NODE_HOST:-127.0.0.1}
      - NODE_NICKNAME=${NODE_NICKNAME:-hyperspace-node}
      - NODE_LOCATION=${NODE_LOCATION:-Unknown}
      - NODE_TAGS=${NODE_TAGS:-dev}
      - NODE_OWNER=${NODE_OWNER:-}
      - NODE_COLOR=${NODE_COLOR:-#ef4444}
      - NODE_AVATAR_STYLE=${NODE_AVATAR_STYLE:-bottts}
      # --- hardware ---
      - NODE_RAM_GB=${NODE_RAM_GB:-8}
      # --- modelli ---
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_AGENT_MODEL=qwen2.5:7b
      - DEFAULT_CODER_MODEL=qwen2.5-coder:7b
      - DEFAULT_REASONER_MODEL=gemma3:9b
      # --- sicurezza ---
      - HYPERSPACE_CLUSTER_SECRET=${HYPERSPACE_CLUSTER_SECRET:-}
      # --- discovery ---
      - AUTHORITY_URL=${AUTHORITY_URL:-http://authority:8766}
      - NODE_PEERS=
      - GOSSIP_INTERVAL_SEC=30
      - ANNOUNCE_INTERVAL_SEC=60
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - hyperspace-ext
    volumes:
      - node_ext_memory:/node/shared/memory
      - node_ext_dreams:/node/runtime/dreams

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: hyperspace-dashboard-ext
    ports:
      - "8769:8769"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - CONTROL_PLANE_URL=${AUTHORITY_URL:-http://authority:8766}
      - AUTHORITY_URL=${AUTHORITY_URL:-http://authority:8766}
      - NODE_URLS=http://node:8765
      - CONTAINER_SUFFIX=-ext
      # Solo i container presenti sul nodo esterno
      - SERVICES_FILTER=hyperspace-ollama,hyperspace-node,hyperspace-webui,hyperspace-dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      - node
    networks:
      - hyperspace-ext

volumes:
  ollama_models:
  webui_data:
  node_ext_memory:
  node_ext_dreams:

networks:
  hyperspace-ext:
    driver: bridge
